name: Build satlink

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
          cache-dependency-path: satlink/go.sum
      - name: Test controller
        run: go -C satlink test -race ./...
      - name: Build binary and check bundled traces
        env:
          CGO_ENABLED: '0'
        run: |
          bundle="$RUNNER_TEMP/satlink-bundle"
          mkdir -p "$bundle"
          go -C satlink build -mod=readonly -trimpath -o "$bundle/satlink" .
          cp examples/transparent-sn.json examples/ns3-tdcho-ue0.json "$bundle/"
          mkdir -p "$bundle/licenses"
          cp docs/sources/free-ran-ue-LICENSE "$bundle/licenses/"
          cp "$(go env GOROOT)/LICENSE" "$bundle/licenses/Go-LICENSE"
          go -C satlink list -m -f '{{if not .Main}}{{.Path}} {{.Dir}}{{end}}' all |
            while read -r module dir; do
              mkdir -p "$bundle/licenses/$module"
              cp "$dir/LICENSE" "$bundle/licenses/$module/"
            done
          for trace in "$bundle"/*.json; do
            "$bundle/satlink" -check -trace "$trace" > /dev/null
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: satlink-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/satlink-bundle/
          if-no-files-found: error

  release:
    name: Publish Linux ZIPs
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency: release-${{ github.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify this run's original ZIPs
        run: |
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" > artifacts.json
          for arch in amd64 arm64; do
            name="satlink-linux-$arch"
            artifact=$(jq -cer --arg name "$name" \
              '.artifacts | map(select(.name == $name and (.expired | not))) | max_by(.id) // error("missing " + $name)' artifacts.json)
            id=$(jq -r .id <<< "$artifact")
            digest=$(jq -er '.digest | sub("^sha256:"; "")' <<< "$artifact")
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "$name.zip"
            echo "$digest  $name.zip" | sha256sum --check
          done

      - name: Attach both ZIPs and publish
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --json isDraft,assets > release.json; then
            gh release create "$tag" --draft --verify-tag --title "satlink $tag" --generate-notes \
              --notes "Download the ZIP for your Linux architecture. Each includes satlink, two example traces, and license files."
            gh release view "$tag" --json isDraft,assets > release.json
          fi
          if jq -e '.isDraft' release.json > /dev/null; then
            gh release upload "$tag" satlink-linux-{amd64,arm64}.zip --clobber
            gh release edit "$tag" --draft=false
          else
            # A retry can arrive after GitHub already published the release.
            for asset in satlink-linux-{amd64,arm64}.zip; do
              if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded")' release.json > /dev/null; then
                gh release upload "$tag" "$asset"
              fi
            done
          fi
